appId: com.hippocampus.app
productName: Hippocampus
copyright: Rodolfo Bortolin

directories:
  output: release
  buildResources: build

afterSign: build/sign-registrar.cjs

# The core is not packaged code: it is the TypeScript itself, run by Electron's
# Node with --experimental-strip-types. Inside an asar it does not open — Node
# reads the file from disk, and an asar is not disk. So the bundle goes without
# asar rather than carrying an exception list that breaks the day someone adds
# an import.
asar: false

files:
  - app/**
  - dist/**
  - core/**
  - package.json
  - '!**/*.map'

# The native helpers go into Resources with the signature they already carry.
# They must not be re-signed here: the Accessibility grant binds to their
# identity, and macOS treats "same Developer ID" as the same thing.
extraResources:
  - from: native
    to: native
    filter:
      - '**/*.app/**'
  - from: scripts
    to: scripts
    filter:
      - launch-core.sh
      - launch-focus.sh
      - launch-listener.sh
      - permissao.sh

# Outside Resources because macOS demands these two exact places: the agents'
# plists in Contents/Library/LaunchAgents, and the registrar in Contents/MacOS,
# which is where `Bundle.main` resolves to the app.
extraFiles:
  - from: build/agents
    to: Library/LaunchAgents
  - from: native/bin/hippocampus-agents
    to: MacOS/hippocampus-agents

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # The registrar is signed by the afterSign hook with the app's identity, not
  # here: electron-builder would use the filename as the identifier, and
  # SMAppService refuses to register an agent asked for by something that is
  # not the app.
  # Not sandboxed, on purpose. It reads browser history, talks to launchd and
  # uses the Accessibility API — the three things the sandbox exists to prevent.
  # An app outside the Mac App Store does not need it.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dir
      arch: [arm64]
  extendInfo:
    # Without these sentences macOS kills the app the first time it asks for
    # the permission, instead of showing a dialog. They stay in English: the
    # Info.plist is static, and localising them needs an InfoPlist.strings per
    # language, which is worth doing but is not done yet.
    NSMicrophoneUsageDescription: >-
      Hippocampus listens for the wake word and for your question. The audio
      does not leave this machine unless you ask it to.
    NSSpeechRecognitionUsageDescription: >-
      The wake word is recognised inside your Mac, without sending audio
      anywhere.
    NSAppleEventsUsageDescription: >-
      Hippocampus asks Spotify, Music and your browser what is playing, to
      know which soundtrack you work to.
    NSSystemAdministrationUsageDescription: >-
      Hippocampus installs an agent that measures your day while you work.
    # Asked only after the Calendar switch is turned on in Settings.
    NSCalendarsFullAccessUsageDescription: >-
      Hippocampus reads the names and times of your meetings to name the calls
      it already measures. Nothing leaves this machine.
    NSCalendarsUsageDescription: >-
      Hippocampus reads the names and times of your meetings to name the calls
      it already measures. Nothing leaves this machine.
