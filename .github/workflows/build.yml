# O que dá para verificar sem um Mac: que os tipos fecham e que a interface
# compila. O coletor depende de Acessibilidade, CoreAudio e NSWorkspace, e nada
# disso existe num runner — fingir que existe daria um verde que não vale nada.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
