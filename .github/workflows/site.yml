# The website moved to Vercel: https://hippocampus-black.vercel.app/
#
# GitHub Pages keeps the old address alive as a redirect, and nothing more —
# links to https://rodolfobortolin.github.io/hippocampus/ are out there, in
# release notes and in people's bookmarks, and a copy of the site at two
# addresses would compete with itself in search. Each page says where the site
# is now, both to the browser (a refresh) and to a crawler (the canonical link).
#
# It runs when this file changes, and by hand.
name: site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer one replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect
        run: |
          mkdir -p out
          page='<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hippocampus has moved</title><link rel="canonical" href="https://hippocampus-black.vercel.app/"><meta http-equiv="refresh" content="0; url=https://hippocampus-black.vercel.app/"><meta name="robots" content="noindex"></head><body><p>Hippocampus now lives at <a href="https://hippocampus-black.vercel.app/">https://hippocampus-black.vercel.app/</a>.</p></body></html>'
          echo "$page" > out/index.html
          echo "$page" > out/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
