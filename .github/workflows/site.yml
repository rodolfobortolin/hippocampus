# Publishes the website on GitHub Pages:
# https://rodolfobortolin.github.io/hippocampus/
#
# It runs when something the site is built from changes on main — the site
# itself, and the sphere it borrows from the app — when a release is
# published, since the page names the latest version, and by hand. Commits to
# the app alone do not publish anything: the site would come out the same.
name: site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/three/**'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer one replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site needs three.js and Vite, not Electron's 100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  # A release deploys from its tag, not from main. The github-pages
  # environment allows both — main, and tags matching v* — in the
  # repository's environment settings; without the tag rule the release
  # run is refused.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
